<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sanity Capped Emotes</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>The guild emote pack</h1>
    <p class="sub">Everything below is live in the addon. Click an emote to copy what you type in chat.</p>

    <div class="card install">
      <div>
        <strong>Install or update</strong><br />
        <span style="color:var(--muted);font-size:13px">WoWUp → Get Addons → Install from URL</span>
      </div>
      <code id="repo">loading…</code>
      <button id="copyRepo" class="ghost">Copy URL</button>
      <span id="release" class="tag"></span>
    </div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Search emotes…" autocomplete="off" />
      <span class="tag" id="count"></span>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>No emotes yet. Be the first to <a href="/upload.html">upload one</a>.</div>
  </main>

  <script type="module">
    import { api, header, timeAgo } from "/app.js";

    document.getElementById("nav").innerHTML = header("browse");

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const q = document.getElementById("q");
    let emotes = [];

    function render() {
      const term = q.value.trim().toLowerCase();
      const shown = emotes.filter(
        (e) => !term || e.name.toLowerCase().includes(term) || e.uploader.toLowerCase().includes(term)
      );
      document.getElementById("count").textContent =
        `${shown.length} of ${emotes.length} emote${emotes.length === 1 ? "" : "s"}`;
      empty.hidden = emotes.length > 0;
      grid.innerHTML = shown
        .map(
          (e) => `
          <div class="emote" data-name="${e.name}" title="Click to copy ${e.name}">
            <img src="${e.url}" alt="${e.name}" loading="lazy" />
            <div class="name">${e.name}</div>
            <div class="by">by ${e.uploader} · ${timeAgo(e.createdAt)}</div>
          </div>`
        )
        .join("");
    }

    grid.addEventListener("click", (ev) => {
      const card = ev.target.closest(".emote");
      if (!card) return;
      navigator.clipboard.writeText(card.dataset.name);
      const label = card.querySelector(".name");
      const was = label.textContent;
      label.textContent = "copied!";
      setTimeout(() => (label.textContent = was), 900);
    });

    q.addEventListener("input", render);

    api("/api/emotes").then((d) => { emotes = d.emotes; render(); });

    api("/api/status").then((s) => {
      document.getElementById("repo").textContent = s.repoUrl;
      document.getElementById("copyRepo").onclick = () => navigator.clipboard.writeText(s.repoUrl);
      if (s.release) {
        document.getElementById("release").innerHTML =
          `latest <a href="${s.release.url}" target="_blank" rel="noopener">${s.release.tag}</a>`;
      }
    });
  </script>
</body>
</html>
