<!doctype html>
<html lang="en" th:replace="~{layout/base :: page(~{::title}, 'upload', ~{::main}, ~{::scripts})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upload an emote or a sound</title>
</head>
<body>

<main class="narrow">
    <h1>Upload an emote or a sound</h1>
    <p class="sub">
        Emotes: GIF, PNG, WebP or JPEG. Sounds: MP3, up to
        <span th:text="${maxSoundSeconds}">20</span> seconds.
        Either way, up to <span th:text="${maxMegabytes}">2</span> MB.
    </p>

    <p class="msg ok" id="sent" role="status"></p>

    <form autocomplete="off" class="card" id="upload-form" th:data-max-sound-seconds="${maxSoundSeconds}">
        <label class="drop" for="file" id="drop">
            <span id="drop-text">Drop an image or an MP3 here, or click to pick one</span>
            <img alt="" hidden id="preview">
        </label>
        <input accept="image/gif,image/png,image/webp,image/jpeg,audio/mpeg,.mp3" hidden id="file" name="file"
               type="file">
        <audio controls hidden id="listen"></audio>

        <label class="field">
            <span id="name-label">Name</span>
            <input id="name" name="name" placeholder="peepoHmm" type="text">
        </label>
        <p class="hint" id="trigger"></p>
        <p class="chatline" hidden id="chat-preview"></p>

        <label class="field">
            <span>Your name</span>
            <input id="uploader" name="uploader" placeholder="Whoever you are in guild chat" type="text">
        </label>

        <div class="actions">
            <button disabled id="submit" type="submit">Submit for approval</button>
            <button class="ghost" id="reset" type="button">Clear</button>
        </div>

        <p class="msg" id="message" role="status"></p>
    </form>
</main>

<th:block th:fragment="scripts">
    <script th:src="@{/js/upload.js}" type="module"></script>
</th:block>

</body>
</html>
