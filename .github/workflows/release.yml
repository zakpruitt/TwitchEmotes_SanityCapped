name: Build and release

# Approving an emote on the website commits an image into tools/source/, and
# approving a sound commits an MP3 into Soundboard_SanityCapped/Sounds/. Either
# lands here. Rapid approvals collapse into one release via the concurrency group.
on:
  push:
    branches: [ main ]
    paths:
      - 'tools/source/**'
      - 'tools/emotes.json'
      - 'Soundboard_SanityCapped/Sounds/**'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install pillow

      - name: Build emote textures
        run: python tools/build_emotes.py

      - name: Build sound list
        run: python tools/build_sounds.py

      - name: Stamp version
        id: ver
        run: |
          VERSION="1.${{ github.run_number }}"
          sed -i -E "s/^## Version:.*/## Version: ${VERSION}/" \
            TwitchEmotes_SanityCapped.toc Soundboard_SanityCapped/Soundboard_SanityCapped.toc
          # Every interface on the .toc line: retail ones plus 16xxx for WoW: Forever
          INTERFACES=$(sed -nE 's/^## Interface:[[:space:]]*//p' TwitchEmotes_SanityCapped.toc | head -1 | tr ',' ' ' | xargs)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "interfaces=${INTERFACES}" >> "$GITHUB_OUTPUT"

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Emotes EmoteData.lua tools/manifest.json TwitchEmotes_SanityCapped.toc \
            Soundboard_SanityCapped tools/sound_manifest.json
          if git diff --cached --quiet; then
            echo "Nothing regenerated."
          else
            git commit -m "Build ${{ steps.ver.outputs.version }} [skip ci]"
            git push
          fi

      - name: Package
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP="TwitchEmotes_SanityCapped-${VERSION}.zip"
          # Copy only what WoW loads; the site and build tooling stay out of the zip.
          rm -rf dist && mkdir -p dist/TwitchEmotes_SanityCapped
          cp -r TwitchEmotes_SanityCapped.toc *.lua Emotes dist/TwitchEmotes_SanityCapped/
          # The sound pack rides in the same zip as a second addon folder. Each
          # folder does nothing unless its base addon is installed.
          cp -r Soundboard_SanityCapped dist/
          (cd dist && zip -qr "../${ZIP}" TwitchEmotes_SanityCapped Soundboard_SanityCapped)
          # release.json is what WoWUp reads to match the asset to a game. The one zip is
          # listed for retail (mainline) and WoW: Forever (16xxx interfaces), so both
          # clients always get the same emotes.
          for i in ${{ steps.ver.outputs.interfaces }}; do
            if [ "$i" -ge 16000 ] && [ "$i" -lt 20000 ]; then FLAVOR=forever; else FLAVOR=mainline; fi
            jq -n --arg flavor "$FLAVOR" --argjson interface "$i" '{flavor: $flavor, interface: $interface}'
          done | jq -s --arg version "$VERSION" --arg zip "$ZIP" \
            '{releases: [{name: "TwitchEmotes_SanityCapped", version: $version, filename: $zip, nolib: false, metadata: .}]}' \
            > release.json
          cat release.json
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Release notes
        id: notes
        run: |
          {
            echo "Emotes in this build (\`$(python -c "import json;print(json.load(open('tools/manifest.json'))['count'])")\` total):"
            echo
            python - <<'PY'
          import json
          for e in json.load(open("tools/manifest.json"))["emotes"]:
              print(f"- `{e['name']}`" + (" (animated)" if e["animated"] else ""))
          PY
            echo
            echo "Sounds in this build (\`$(python -c "import json;print(json.load(open('tools/sound_manifest.json'))['count'])")\` total, played through the Soundboard addon):"
            echo
            python - <<'PY'
          import json
          for s in json.load(open("tools/sound_manifest.json"))["sounds"]:
              print(f"- `{s['name']}` (`{s['command']}`, {s['seconds']}s)")
          PY
            echo
            echo "Install or update with WoWUp: **Get Addons -> Install from URL** -> \`${{ github.server_url }}/${{ github.repository }}\`"
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "${{ steps.pkg.outputs.zip }}" release.json \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            --target "$(git rev-parse HEAD)"

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          PROJECT=$(sed -nE 's/^## X-Curse-Project-ID:[[:space:]]*([0-9]+).*/\1/p' TwitchEmotes_SanityCapped.toc)
          if [ -z "$CF_API_KEY" ] || [ -z "$PROJECT" ]; then
            echo "::notice::Skipped the CurseForge upload: it needs the CF_API_KEY secret and '## X-Curse-Project-ID' in the .toc"
            exit 0
          fi
          # CurseForge tags files by game version ID, so each interface is looked up by name:
          # 120100 -> 12.1.0 under retail, 16001 -> 1.60.1 under Forever.
          VERSIONS=$(curl -fsS -H "x-api-token: $CF_API_KEY" https://wow.curseforge.com/api/game/wow/versions)
          IDS=()
          for i in ${{ steps.ver.outputs.interfaces }}; do
            NAME="$((i / 10000)).$((i / 100 % 100)).$((i % 100))"
            if [ "$i" -ge 16000 ] && [ "$i" -lt 20000 ]; then TYPE=88568; else TYPE=517; fi
            ID=$(jq -r --arg v "$NAME" --argjson t "$TYPE" \
              '[.[] | select(.gameVersionTypeID == $t and .name == $v)][0].id // empty' <<< "$VERSIONS")
            if [ -z "$ID" ]; then
              echo "::error::CurseForge has no game version ${NAME} for interface ${i}"
              exit 1
            fi
            echo "interface ${i} -> ${NAME} (id ${ID})"
            IDS+=("$ID")
          done
          jq -n --arg name "${{ steps.ver.outputs.version }}" --rawfile changelog notes.md \
            --argjson ids "$(printf '%s\n' "${IDS[@]}" | jq -s .)" \
            '{displayName: $name, gameVersions: $ids, releaseType: "release", changelog: $changelog, changelogType: "markdown"}' \
            > cf.json
          curl -fsS --retry 3 --retry-delay 10 -H "x-api-token: $CF_API_KEY" \
            -F "metadata=<cf.json" -F "file=@${{ steps.pkg.outputs.zip }}" \
            "https://wow.curseforge.com/api/projects/${PROJECT}/upload-file"
