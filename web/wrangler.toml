name = "sanity-capped-emotes"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "sanity-capped-emotes"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sanity-capped-emotes"

[vars]
GITHUB_REPO = "zakpruitt/TwitchEmotes_SanityCapped"

# Secrets (never in this file):
#   npx wrangler pages secret put GUILD_PASSCODE
#   npx wrangler pages secret put ADMIN_PASSCODE
#   npx wrangler pages secret put GITHUB_TOKEN
# For local dev put the same keys in web/.dev.vars (gitignored).
